<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}body{margin:0;background:#14161a;color:#ecece8;font-family:Inter,system-ui,sans-serif}
#stage{position:sticky;top:0;height:46vh;min-height:260px;z-index:4;background:#14161a}
#lab{position:absolute;left:12px;bottom:10px;z-index:5;pointer-events:none}
#lab b{font:700 17px/1.1 Oswald,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;display:block}
#lab i{font:700 10px/1 'JetBrains Mono',monospace;color:#f2b134;letter-spacing:.08em;font-style:normal}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 6px;position:sticky;top:46vh;background:#14161a;z-index:3}
.chips button{flex:none;border:1px solid rgba(255,255,255,.16);background:transparent;color:#c7ccd3;border-radius:999px;padding:8px 12px;font:600 12px/1 Inter,sans-serif}
.chips button.on{background:#f2b134;color:#1c1500;border-color:#f2b134}
.list{padding:4px 12px 40px}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 12px;border-radius:12px;border:1px solid transparent;font:600 14px/1.2 Inter,sans-serif;cursor:pointer}
.row small{font:700 10px/1 'JetBrains Mono',monospace;color:#8b9098;letter-spacing:.06em}
.row.on{background:#1d2026;border-color:rgba(242,177,52,.5)}
.row:active{background:#1d2026}
.hint{position:absolute;right:12px;bottom:10px;z-index:5;font:600 10.5px/1 Inter;color:#8b9098;pointer-events:none}
</style></head><body>
<div id="err" style="display:none;position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#3a1010;border:1px solid #c44;color:#fcc;font:12px/1.4 monospace;padding:10px;border-radius:8px;white-space:pre-wrap"></div>
<script>window.addEventListener('error',function(e){var d=document.getElementById('err');d.style.display='block';d.textContent+=(e.message||'error')+' '+(e.filename||'').split('/').pop()+':'+(e.lineno||'')+'\n'});</script>
<div id="stage"><div id="lab"><b id="nm"></b><i id="eq"></i></div><div class="hint">drag to rotate</div></div>
<div class="chips" id="chips"></div><div class="list" id="list"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="ragdoll/engine.js?v=10"></script><script src="ragdoll/motions.js?v=10"></script><script src="ragdoll/map.js?v=10"></script><script src="ragdoll/lib.js?v=10"></script><script src="ragdoll/ragdoll3d.js?v=10"></script>
<script>
var MUS=['All','Chest','Back','Shoulders','Traps','Biceps','Triceps','Forearms','Abs','Quads','Hamstrings','Glutes','Calves'], cur='All', sel=null;
var chips=document.getElementById('chips'), list=document.getElementById('list');
if(typeof THREE==='undefined'){document.getElementById('err').style.display='block';document.getElementById('err').textContent+='three.js did not load (network/CDN)\n'}
try{R3.init(document.getElementById('stage'));}catch(e){var d=document.getElementById('err');d.style.display='block';d.textContent+='3D start failed: '+e.message+'\n'}
MUS.forEach(function(m){var b=document.createElement('button');b.textContent=m;if(m==='All')b.className='on';b.onclick=function(){cur=m;draw();[].forEach.call(chips.children,function(c){c.classList.toggle('on',c.textContent===m)})};chips.appendChild(b)});
function pick(x,row){ var s=RDMap(x.n,x.e,x.m); if(!s) return; sel=x.n; R3.show(s); document.getElementById('nm').textContent=x.n; document.getElementById('eq').textContent=x.e.toUpperCase()+' · '+x.m.toUpperCase(); [].forEach.call(list.children,function(r){r.classList.toggle('on',r===row)}); }
function draw(){ list.innerHTML=''; var first=null; LIB.forEach(function(x){ if(cur!=='All'&&x.m!==cur) return; var r=document.createElement('div'); r.className='row'; r.innerHTML='<span></span><small></small>'; r.firstChild.textContent=x.n; r.lastChild.textContent=x.e.toUpperCase(); r.onclick=function(){pick(x,r); window.scrollTo({top:0,behavior:'smooth'})}; list.appendChild(r); if(!first)first=[x,r]; }); if(first) pick(first[0],first[1]); }
draw();
</script></body></html>
